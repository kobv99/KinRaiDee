name: Handoff analyzer fixes

on:
  push:
    branches:
      - fix/main-ingredient-codex-handoff
    paths:
      - .github/workflows/handoff-fix-analyze.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/main-ingredient-codex-handoff

      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          pantry_path = Path('apps/mobile/lib/features/recipe/data/pantry_catalog_canonical_definitions.dart')
          pantry = pantry_path.read_text(encoding='utf-8')
          old_salmon = """  _DefinitionSeed(
            'salmon',
            'Salmon',
            'ปลาแซลมอน',
            'seafood',
            '🐟',
            aliases: <String>['แซลมอน', 'salmon'],
            parentId: 'fish',
            unitFamily: IngredientUnitFamily.fish,
          ),"""
          new_salmon = """  _DefinitionSeed(
            'salmon',
            'Salmon',
            'ปลาแซลมอน',
            'seafood',
            '🐟',
            aliases: <String>['แซลมอน', 'salmon'],
            parentId: 'fish',
            unitFamily: IngredientUnitFamily.fish,
            nodeType: CanonicalIngredientNodeType.ingredient,
            selectableAsMainIngredient: true,
            ingredientForms: <String>['boneless_fillet', 'steak', 'whole_cleaned'],
            textures: <String>['oily_firm'],
            supportedCookingMethods: <String>['ทอด', 'ย่าง', 'อบ', 'นึ่ง'],
          ),"""
          if old_salmon not in pantry:
            raise SystemExit('Expected salmon seed block not found')
          pantry_path.write_text(pantry.replace(old_salmon, new_salmon, 1), encoding='utf-8')

          test_path = Path('apps/mobile/test/features/recipe/local_recipe_datasource_test.dart')
          test_source = test_path.read_text(encoding='utf-8')
          old_expect = """      expect(
            mackerelRecipes,
            everyElement(
              predicate(
                (recipe) => recipe.compatibility.exactIngredientIds.contains(
                  'mackerel',
                ),
              ),
            ),
          );"""
          new_expect = """      expect(
            mackerelRecipes.every(
              (recipe) => recipe.compatibility.exactIngredientIds.contains(
                'mackerel',
              ),
            ),
            isTrue,
          );"""
          if old_expect not in test_source:
            raise SystemExit('Expected nullable predicate block not found')
          test_path.write_text(test_source.replace(old_expect, new_expect, 1), encoding='utf-8')

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format touched files
        working-directory: apps/mobile
        run: dart format lib/features/recipe/data/pantry_catalog_canonical_definitions.dart test/features/recipe/local_recipe_datasource_test.dart

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build web
        working-directory: apps/mobile
        run: flutter build web

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/features/recipe/data/pantry_catalog_canonical_definitions.dart apps/mobile/test/features/recipe/local_recipe_datasource_test.dart
          git commit -m "fix: clear handoff analyzer issues"
          git push origin HEAD:fix/main-ingredient-codex-handoff
