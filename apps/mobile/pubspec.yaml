name: mobile
description: "KinRaiDee mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipes/
    - assets/ingredients/
    - assets/recipe_images/
  fonts:
    # Split into two families, matching how Noto is packaged upstream:
    # NotoSans covers Latin/digits/punctuation, NotoSansThai covers Thai
    # script only. AppTheme sets NotoSans as primary with NotoSansThai as
    # fontFamilyFallback, so both scripts render from bundled assets with
    # no runtime font-fetching at all.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
